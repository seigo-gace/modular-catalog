[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-open-source-collector"
version = "1.0.0"
description = "Keyword-driven multi-provider open-source Skill/Script collector with modular reconstruction and Astera admission."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
modular-collector = "modular_collector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
