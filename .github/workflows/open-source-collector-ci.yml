name: Open Source Collector CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing catalog
        run: npm run check
      - name: Verify collector
        working-directory: collector
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  execute-request:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect pending request
        id: gate
        run: |
          request='collector/run-requests/skill-collection-250-2026-07-30-r2.request.json'
          result='collector/run-results/skill-collection-250-2026-07-30-r2.result.json'
          if [ -f "$request" ] && [ ! -f "$result" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Execute 250-Skill collection and Astera loop
        id: collect
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        working-directory: collector
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          ASTERA_PROCESS_BASE_URL: ${{ secrets.ASTERA_PROCESS_BASE_URL }}
          ASTERA_EVALUATOR_BASE_URL: ${{ secrets.ASTERA_EVALUATOR_BASE_URL }}
          ASTERA_SKILL_API_KEY: ${{ secrets.ASTERA_SKILL_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '10d3c0ac-5b2b-4f3b-8a22-a2b7685003bb' }}
        run: |
          python -m modular_collector run \
            --config skill-collection-250.json \
            --workspace ../collector-output \
            --process-limit 250 \
            --max-debug-rounds 3 \
            --sync-notion \
            --json > ../collector-output-summary.json

      - name: Upload request output
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skill-collection-250-output
          path: |
            collector-output
            collector-output-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish observable result
        if: always() && steps.gate.outputs.run == 'true'
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p collector/run-results
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {
              'request': 'skill-collection-250-2026-07-30-r2',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'source_commit': os.environ['GITHUB_SHA'],
              'execution_outcome': os.environ.get('COLLECT_OUTCOME', 'unknown'),
              'target_total': 250,
              'selected_total': 0,
              'quota_shortfall': 250,
              'processed_total': 0,
              'admitted_total': 0,
              'processing_failures': 0,
              'notion_created_or_updated': 0,
              'notion_failures': 0,
          }
          quota = Path('collector-output/discovery/quota-summary.json')
          admissions = Path('collector-output/results/admissions.json')
          failures = Path('collector-output/results/processing-failures.json')
          notion = Path('collector-output/results/notion-sync-results.json')
          if quota.exists():
              rows = json.loads(quota.read_text())
              result['target_total'] = sum(int(x['target']) for x in rows)
              result['selected_total'] = sum(int(x['selected']) for x in rows)
              result['quota_shortfall'] = sum(int(x['shortfall']) for x in rows)
              result['categories'] = rows
          if admissions.exists():
              rows = json.loads(admissions.read_text())
              result['processed_total'] = len(rows)
              result['admitted_total'] = sum(1 for x in rows if x['astera']['eligible'])
              result['debugged_total'] = sum(1 for x in rows if x['astera'].get('revision_count', 0) > 0)
          if failures.exists():
              result['processing_failures'] = len(json.loads(failures.read_text()))
          if notion.exists():
              rows = json.loads(notion.read_text())
              result['notion_created_or_updated'] = sum(1 for x in rows if x.get('status') in {'created', 'updated'})
              result['notion_failures'] = sum(1 for x in rows if x.get('status') == 'failed')
          Path('collector/run-results/skill-collection-250-2026-07-30-r2.result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collector/run-results/skill-collection-250-2026-07-30-r2.result.json
          git commit -m 'Record 250-Skill collection result [skip ci]'
          git pull --rebase origin "$HEAD_BRANCH"
          git push origin HEAD:"$HEAD_BRANCH"
