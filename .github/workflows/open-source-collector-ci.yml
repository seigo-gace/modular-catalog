name: Open Source Collector CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing catalog
        run: npm run check
      - name: Verify collector
        working-directory: collector
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
