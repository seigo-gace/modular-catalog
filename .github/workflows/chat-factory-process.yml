name: Chat Factory Process

on:
  push:
    branches:
      - control/modulecatalog-chat-orchestration-v1
    paths:
      - '.gace-control/requests/*.json'

permissions:
  contents: write

concurrency:
  group: modulecatalog-chat-control
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and validate one Chat request
        id: request
        shell: bash
        run: |
          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '.gace-control/requests/*.json')
          test "${#files[@]}" -eq 1
          export REQUEST_FILE="${files[0]}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateFactoryRequest } from './src/chat-control-plane.js';
          const file = process.env.REQUEST_FILE;
          const request = validateFactoryRequest(JSON.parse(fs.readFileSync(file, 'utf8')));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `request_file=${file}\nrequest_id=${request.request_id}\ncatalog_commit=${request.catalog_commit}\n`);
          console.log(`CHAT_FACTORY_REQUEST=PASS REQUEST_ID=${request.request_id} CATALOG_COMMIT=${request.catalog_commit}`);
          NODE

      - name: Require request commit to equal current finalization HEAD
        shell: bash
        run: |
          current="$(git ls-remote --exit-code origin refs/heads/feat/reusable-knowledge-factory-v1-20261002 | awk '{print $1}')"
          test "$current" =~ ^[0-9a-f]{40}$
          requested='${{ steps.request.outputs.catalog_commit }}'
          if [ "$requested" != "$current" ]; then
            echo "CHAT_FACTORY_STALE_COMMIT requested=$requested current=$current" >&2
            exit 1
          fi
          echo "CHAT_FACTORY_CURRENT_HEAD=PASS COMMIT=$current"

      - name: Checkout exact Catalog commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.catalog_commit }}
          path: source
          fetch-depth: 1

      - name: Install exact-source dependencies
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run exact-source Factory gates
        working-directory: source
        run: npm run check

      - name: Verify portable reuse outside Catalog tree
        shell: bash
        run: node source/scripts/verify-portable-reuse.mjs --root source --json-output "$RUNNER_TEMP/portable-reuse.json"

      - name: Export and preflight full review snapshot
        shell: bash
        run: |
          snapshot="$RUNNER_TEMP/chat-review-snapshot"
          rm -rf "$snapshot"
          mkdir -p "$snapshot"
          node source/src/cli.js export-reusable-assets --root source --output "$snapshot" --catalog-commit '${{ steps.request.outputs.catalog_commit }}' --json
          node source/src/cli.js preflight-kb-delivery "$snapshot" --root source --json

      - name: Build immutable Factory result
        shell: bash
        run: |
          result='.gace-control/results/${{ steps.request.outputs.request_id }}.json'
          node source/scripts/build-chat-factory-result.mjs --request '${{ steps.request.outputs.request_file }}' --source-root source --snapshot "$RUNNER_TEMP/chat-review-snapshot" --portable-reuse "$RUNNER_TEMP/portable-reuse.json" --output "$result"

      - name: Upload review snapshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat-factory-${{ steps.request.outputs.request_id }}
          path: |
            ${{ runner.temp }}/chat-review-snapshot
            ${{ runner.temp }}/portable-reuse.json
            .gace-control/results/${{ steps.request.outputs.request_id }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Record Factory result on control branch
        shell: bash
        run: |
          result='.gace-control/results/${{ steps.request.outputs.request_id }}.json'
          git config user.name 'modulecatalog-control'
          git config user.email 'modulecatalog-control@users.noreply.github.com'
          git add -- "$result"
          if git diff --cached --quiet; then
            echo 'CHAT_FACTORY_RESULT=UNCHANGED'
            exit 0
          fi
          git commit -m 'control: record Chat factory result ${{ steps.request.outputs.request_id }}'
          git push origin HEAD:control/modulecatalog-chat-orchestration-v1
