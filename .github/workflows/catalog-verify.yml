name: Catalog Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Verify Windows transport syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/pull-modulecatalog-kb-delivery-windows.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'WINDOWS_KB_PULL_SCRIPT_PARSE=PASS'

      - name: Core tests
        run: npm test

      - name: Audit reusable asset and 5V profile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-reusable-asset-profile.mjs . > "$RUNNER_TEMP/reusable-asset-audit.json"
          node --input-type=module - "$RUNNER_TEMP/reusable-asset-audit.json" <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(`REUSABLE_ASSET_AUDIT_COUNT=${report.asset_count}`);
          console.log(`PRIMARY_TYPE_COUNTS=${JSON.stringify(report.primary_type_counts)}`);
          console.log(`REUSABLE_ASSET_TYPE_COUNTS=${JSON.stringify(report.reusable_asset_type_counts)}`);
          console.log(`FIVE_V_STATUS_COUNTS=${JSON.stringify(report.five_v_status_counts)}`);
          console.log(`FIVE_V_LEVEL_COUNTS=${JSON.stringify(report.five_v_level_counts)}`);
          for (const asset of report.assets) {
            console.log(`ASSET_PROFILE id=${asset.asset_id} primary=${asset.primary_type} types=${asset.asset_types.join(',') || 'NOT_RECORDED'} five_v_status=${asset.five_v_status} five_v_level=${asset.five_v_level ?? 'NOT_RECORDED'} legacy_layers=${asset.legacy_layers.join(',')}`);
          }
          NODE

      - name: Verify all registered assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find assets -mindepth 1 -maxdepth 1 -type d ! -name '.*' | sort)
          test "${#assets[@]}" -eq 80
          for asset in "${assets[@]}"; do
            echo "[ASSET] $asset"
            node src/cli.js validate "${asset#assets/}" --json
          done
          npm run verify

      - name: Verify all asset normal tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets -type f -path '*/tests/normal/*.test.cjs' | sort)
          test "${#files[@]}" -eq 80
          for file in "${files[@]}"; do
            asset="${file%%/tests/normal/*}"
            (
              trap 'rm -f "$asset/package.json"' EXIT
              printf '%s\n' '{"type":"commonjs"}' > "$asset/package.json"
              node --test "$file"
            )
          done

      - name: Verify all asset user tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets -type f -path '*/tests/user/*.test.cjs' | sort)
          test "${#files[@]}" -eq 80
          for file in "${files[@]}"; do
            asset="${file%%/tests/user/*}"
            (
              trap 'rm -f "$asset/package.json"' EXIT
              printf '%s\n' '{"type":"commonjs"}' > "$asset/package.json"
              node --test "$file"
            )
          done

      - name: Verify portable reuse outside Catalog tree
        run: node scripts/verify-portable-reuse.mjs --root . --json-output "$RUNNER_TEMP/portable-reuse.json"

      - name: Confirm catalog index cardinality
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('catalog/index.json', 'utf8'));
          if (index.assetCount !== 80 || index.entries.length !== 80) {
            throw new Error(`Catalog cardinality invalid: assetCount=${index.assetCount}, entries=${index.entries.length}`);
          }
          if (new Set(index.entries.map((entry) => entry.id)).size !== 80) {
            throw new Error('Catalog contains duplicate asset ids');
          }
          console.log('CATALOG_80_PASS');
          NODE
