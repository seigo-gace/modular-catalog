name: Open Source Collector Manual Run

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Collector category plan under collector/
        required: false
        default: 'skill-collection-250.json'
      process_limit:
        description: Maximum candidates to acquire, reconstruct and evaluate
        required: false
        default: '250'
      max_debug_rounds:
        description: Astera debug and re-evaluation rounds below 95
        required: false
        default: '3'
      register_catalog:
        description: Register Astera-admitted assets into modular-catalog
        required: false
        type: boolean
        default: true
      sync_notion:
        description: Sync admitted records to the specified Notion search ledger
        required: false
        type: boolean
        default: true
  push:
    branches:
      - agent/open-source-skill-script-collector
    paths:
      - 'collector/run-requests/*.request.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test isolated collector module and catalog boundary
        working-directory: collector
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Collect, decompose, reconstruct and call Astera APIs
        working-directory: collector
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          ASTERA_PROCESS_BASE_URL: ${{ secrets.ASTERA_PROCESS_BASE_URL }}
          ASTERA_EVALUATOR_BASE_URL: ${{ secrets.ASTERA_EVALUATOR_BASE_URL }}
          ASTERA_SKILL_API_KEY: ${{ secrets.ASTERA_SKILL_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '10d3c0ac-5b2b-4f3b-8a22-a2b7685003bb' }}
        run: |
          set -euo pipefail
          config_path='${{ inputs.config_path || 'skill-collection-250.json' }}'
          process_limit='${{ inputs.process_limit || '250' }}'
          max_debug_rounds='${{ inputs.max_debug_rounds || '3' }}'
          register_catalog='${{ github.event_name == 'push' || inputs.register_catalog == true }}'
          sync_notion='${{ github.event_name == 'push' || inputs.sync_notion == true }}'

          args=(
            run
            --config "$config_path"
            --workspace ../collector-output
            --process-limit "$process_limit"
            --max-debug-rounds "$max_debug_rounds"
            --json
          )
          if [ "$register_catalog" = 'true' ]; then
            args+=(--catalog-root .. --register)
          fi
          if [ "$sync_notion" = 'true' ]; then
            args+=(--sync-notion)
          fi
          python -m modular_collector "${args[@]}" > ../collector-output-summary.json

      - name: Verify quota and admission outputs
        run: |
          test -f collector-output/discovery/quota-summary.json
          test -f collector-output/results/admissions.json
          test -f collector-output/results/checkpoint.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          quotas = json.loads(Path('collector-output/discovery/quota-summary.json').read_text())
          admissions = json.loads(Path('collector-output/results/admissions.json').read_text())
          print(json.dumps({
              'target_total': sum(int(item['target']) for item in quotas),
              'selected_total': sum(int(item['selected']) for item in quotas),
              'shortfall_total': sum(int(item['shortfall']) for item in quotas),
              'processed_total': len(admissions),
              'admitted_total': sum(1 for item in admissions if item['astera']['eligible']),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Create draft PR for admitted catalog assets
        if: ${{ success() && (github.event_name == 'push' || inputs.register_catalog == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- assets catalog; then
            echo "No Astera-admitted catalog changes."
            exit 0
          fi
          branch="automation/open-source-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add assets catalog
          git commit -m "Register Astera-admitted reconstructed Skills"
          git push origin "$branch"
          gh pr create --draft \
            --base main \
            --head "$branch" \
            --title "chore: register Astera-admitted reconstructed Skills" \
            --body "Candidates were decomposed or built from Logic, reconstructed through all five Modular Architecture layers, evaluated by Astera, debugged and re-evaluated below 95, and only 95/95 zero-blocking Skills are included."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-open-source-collector-output
          path: |
            collector-output
            collector-output-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish run result marker
        if: always() && github.event_name == 'push'
        env:
          FINAL_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p collector/run-results
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit': os.environ['GITHUB_SHA'],
              'status': os.environ.get('FINAL_STATUS', 'unknown'),
              'target_total': 250,
              'selected_total': 0,
              'processed_total': 0,
              'admitted_total': 0,
              'processing_failures': 0,
              'notion_sync_results': [],
          }
          quota = Path('collector-output/discovery/quota-summary.json')
          admissions = Path('collector-output/results/admissions.json')
          failures = Path('collector-output/results/processing-failures.json')
          notion = Path('collector-output/results/notion-sync-results.json')
          if quota.exists():
              rows = json.loads(quota.read_text())
              result['target_total'] = sum(int(x['target']) for x in rows)
              result['selected_total'] = sum(int(x['selected']) for x in rows)
              result['quota_shortfall'] = sum(int(x['shortfall']) for x in rows)
          if admissions.exists():
              rows = json.loads(admissions.read_text())
              result['processed_total'] = len(rows)
              result['admitted_total'] = sum(1 for x in rows if x['astera']['eligible'])
          if failures.exists():
              result['processing_failures'] = len(json.loads(failures.read_text()))
          if notion.exists():
              rows = json.loads(notion.read_text())
              result['notion_sync_results'] = rows
              result['notion_created_or_updated'] = sum(1 for x in rows if x.get('status') in {'created', 'updated'})
          output = Path('collector/run-results') / f"{os.environ['GITHUB_RUN_ID']}.result.json"
          output.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          print(output)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/run-results
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record collector run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
