name: Open Source Collector Run

on:
  workflow_dispatch:
    inputs:
      process_limit:
        description: Maximum candidates to acquire and analyze
        required: false
        default: '20'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        working-directory: collector
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect, modularize and evaluate
        working-directory: collector
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          ASTERA_PROCESS_BASE_URL: ${{ secrets.ASTERA_PROCESS_BASE_URL }}
          ASTERA_EVALUATOR_BASE_URL: ${{ secrets.ASTERA_EVALUATOR_BASE_URL }}
          ASTERA_SKILL_API_KEY: ${{ secrets.ASTERA_SKILL_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          python -m modular_collector run \
            --config keywords.example.json \
            --workspace ../collector-output \
            --catalog-root .. \
            --register \
            --sync-notion \
            --process-limit '${{ inputs.process_limit || '20' }}' \
            --json > ../collector-output-summary.json
      - name: Create admitted-assets draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- assets catalog; then
            echo "No Astera-admitted catalog changes."
            exit 0
          fi
          branch="automation/open-source-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add assets catalog
          git commit -m "Register Astera-admitted open-source assets"
          git push origin "$branch"
          gh pr create --draft \
            --base main \
            --head "$branch" \
            --title "chore: register Astera-admitted open-source assets" \
            --body "Automated collection from configured keywords. Only permissive-license candidates that passed local safety gates and Astera 95/95 with zero blocking are included."
      - uses: actions/upload-artifact@v4
        with:
          name: modular-open-source-collector-output
          path: |
            collector-output
            collector-output-summary.json
          if-no-files-found: error
          retention-days: 14
