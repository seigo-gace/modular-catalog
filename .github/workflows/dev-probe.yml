name: Development Probe

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  verify:
    if: >
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)
      || (
        github.event_name == 'pull_request'
        && github.event.pull_request.user.login == github.repository_owner
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || (
        github.event_name == 'issues'
        && startsWith(github.event.issue.title, '[DEV-PROBE]')
        && github.event.issue.user.login == github.repository_owner
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence directory
        run: |
          mkdir -p .dev-probe
          printf '{"repository":"%s","sha":"%s","event":"%s","run_id":"%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" > .dev-probe/meta.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Canonical verification
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee .dev-probe/check.log
          npm run verify:portable 2>&1 | tee .dev-probe/portable.log
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-probe-evidence-${{ github.run_id }}
          path: .dev-probe/
          if-no-files-found: error
          retention-days: 7
